services:
  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    depends_on:
      - postgresql
    environment:
      # The DB variable is a driver used by Temporal to connect to the PostgreSQL database
      # Not to mistake this with the POSTGRES_DB environment variable
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_POSTGRESQL_USER}
      - POSTGRES_PWD=${TEMPORAL_POSTGRESQL_PASSWORD}
      - POSTGRES_DB=${TEMPORAL_POSTGRESQL_DB}
      - POSTGRES_SEEDS=postgresql
    ports:
      - 7233:7233
    networks:
      - temporal-network

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - 8080:8080
    networks:
      - temporal-network

  postgresql:
    image: postgres:${TEMPORAL_POSTGRESQL_VERSION}
    environment:
      - POSTGRES_PASSWORD=${TEMPORAL_POSTGRESQL_PASSWORD}
      - POSTGRES_USER=${TEMPORAL_POSTGRESQL_USER}
      - POSTGRES_DB=${TEMPORAL_POSTGRESQL_DB}
    ports:
      - 5432:5432
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - temporal-network

volumes:
  postgresql-data:

networks:
  temporal-network:
    driver: bridge
